for(let i=0;i&lt;22;i++){const g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${origin.x} ${origin.y})`);const shape=document.createElementNS(ns,type==='wand'?'circle':'path');if(type==='wand'){shape.setAttribute('r',i===0?'20':'3');shape.setAttribute('fill','#ffe575');shape.setAttribute('style','filter:drop-shadow(0 0 6px #ffce35)')}else if(type==='heart'){shape.setAttribute('d','M0 4C-14-4-5-12 0-5C5-12 14-4 0 4Z');shape.setAttribute('fill',i%2?'#e3abb4':'#cf7185');shape.setAttribute('stroke',i%2?'url(#heartOutline)':'url(#heartOutlineDeep)');shape.setAttribute('stroke-width','1')}else if(type==='petal'){shape.setAttribute('d','M0 7Q-11-1-4-8Q7-9 5 0Z');shape.setAttribute('fill',i%2?'#e3abb4':'#cf7185')}else{shape.setAttribute('d','M0-1C-10-7-11 8-3 9C5 14 11 0 3-2Q2-11 8-13M3-2Q0-10-4-11');shape.setAttribute('fill','#cf7185');shape.setAttribute('stroke','#7f9e80');shape.setAttribute('stroke-width','1.3')}g.appendChild(shape);layer.appendChild(g);const a=i*Math.PI*2/22,r=25+Math.random()*65,x=Math.cos(a)*r,y=Math.sin(a)*r;const frames=type==='cherry'?[{opacity:0,transform:'translate(0px,0px) rotate(0deg)'},{opacity:1,transform:`translate(${-y}px,${x}px) rotate(90deg)`,offset:.4},{opacity:0,transform:`translate(${x}px,${y-30}px) rotate(240deg)`}]:[{opacity:0,transform:'translate(0px,0px) scale(.4)'},{opacity:1,offset:.15},{opacity:0,transform:`translate(${x}px,${y-25}px) rotate(${i*23}deg) scale(.5)`}];shape.animate(still?[{opacity:1},{opacity:0}]:frames,{duration:still?400:1400,delay:still?0:i*12,fill:'forwards',easing:'ease-out'})}setTimeout(()=&gt;layer.remove(),1900)}
svg.addEventListener('click',magic);svg.addEventListener('keydown',magic);</script></svg>
function magic(e){const target=e.target.closest('[data-magic]');if(!target)return;if(e.type==='keydown'){if(!['Enter',' '].includes(e.key))return;e.preventDefault()}if(typeof parent!=='undefined'&amp;&amp;parent!==window)parent.postMessage({type:'gingy-art-click',kind:target.getAttribute('data-magic')},location.origin);const box=target.getBBox(),point=svg.createSVGPoint();point.x=box.x+box.width/2;point.y=box.y+box.height/2;const origin=point.matrixTransform(target.getCTM());const type=target.getAttribute('data-magic'),layer=document.createElementNS(ns,'g');layer.setAttribute('pointer-events','none');svg.appendChild(layer);const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

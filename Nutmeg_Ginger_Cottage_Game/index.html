const app=document.querySelector('#app'),errorBox=document.querySelector('#error');let session=JSON.parse(sessionStorage.getItem('gingy-session')||'null'),state=null,busy=false,offset=0,renderKey='';

let preferredDisplay='';try{if(typeof localStorage!=='undefined')preferredDisplay=localStorage.getItem('gingy-display-mode')||''}catch(e){}

function setDisplayMode(mode){if(!['computer','mobile'].includes(mode))return;displayMode=mode;preferredDisplay=mode;try{if(typeof localStorage!=='undefined')localStorage.setItem('gingy-display-mode',mode)}catch(e){}applyDisplayMode()}
if(displayMedia?.addEventListener)displayMedia.addEventListener('change',()=>{if(!preferredDisplay){displayMode=displayMedia.matches?'mobile':'computer';applyDisplayMode()}});
applyDisplayMode();

function furnitureTouchControls(id,i){if(id==='kitchen'&&i===3)return `<div class="mobile-only detail-controls"><button data-sound="freezer" onclick="toggleFurnitureDetail('freezer-door','kitchen',3)">${cottageActions['freezer-door']?'Close':'Open'} Freezer</button><button data-sound="fridge" onclick="toggleFurnitureDetail('fridge-door','kitchen',3)">${cottageActions['fridge-door']?'Close':'Open'} Fridge</button></div>`;if((id==='kitchen'||id==='office')&&i===2){const key=id==='kitchen'?'oven-cake':'desk-books',label=id==='kitchen'?'Cake':'Books';return `<div class="mobile-only detail-controls"><button data-sound="${key==='oven-cake'?'cake':'desk-books'}" onclick="toggleFurnitureDetail('${key}','${id}',2)">${cottageActions[key]?'Stop':'Animate'} ${label}</button></div>`}return ''}

{id:'office',name:'Office',floor:0,color:'#a9c1a3',items:[['Biscuit Floor','Crisp biscuit planks support Nutmeg’s office.',10],['Icing Walls','Piped icing holds these walls together.',35],['Pretzel Desk','Nutmeg writes his recipes at this desk.',70],['Wafer Shelf','A tiny library of fairytale adventures.',90],['Pretzel Chair','',85],['Rock Candy Curio','',100]]},
{id:'bedroom',name:'Bedroom',floor:1,color:'#b99abf',items:[['Biscuit Floor','Upstairs cookie tiles make a steady floor.',15],['Icing Walls','Lavender icing surrounds the bedroom.',40],['Cotton Candy Bed','A fluffy bed with a raspberry quilt.',60],['Tootsie Wardrobe','A wardrobe for Nutmeg’s finest icing outfits.',85],['Candyfloss Rug','',85],['Family Painting','',100]]},
{id:'bathroom',name:'Bathroom',floor:1,color:'#b6d2d8',items:[['Biscuit Floor','Sealed sugar tiles keep this floor crisp.',15],['Icing Walls','Mint icing lines the bathroom walls.',40],['Teacup Bath','A giant teacup makes a perfect bathtub.',65],['Taffy Sink','A sugar-glass mirror above the basin.',90],['Wafer Towel Rack','',85],['Mint Cabinet','',100]]},
{id:'pantry',name:'Sweet Pantry',floor:1,color:'#efd47c',items:[['Biscuit Floor','A biscuit floor for all the sweet supplies.',15],['Icing Walls','Caramel walls keep the pantry cozy.',40],['Gummy Bear Shelf','Shelves filled with colorful gummy bears.',70],['Fudge Workbench','A biscuit workbench for sorting sweet supplies.',95],['Truffle Trolley','',85],['Pocky Board','',100]]}
];

const characterLines={gingy:['Extra icing is always part of the plan.','My buttons believe in you!','A biscuit of courage goes a long way.'],wife:['A little sugar makes a house a home.','Every fairytale needs a cozy kitchen.','Save room for happily ever after.'],pinocchio:['I would never say that I never said that.','The truth has a few interesting corners.','My nose prefers accurate answers.'],prince:['A cottage? I was expecting a palace.','My hair has its own royal appointment.','Even my dramatic entrances are magnificent.']};

let rulesExpanded=true;
function rememberRules(details){rulesExpanded=details.open}
function rules(){return `<details ${rulesExpanded?'open':''} ontoggle="rememberRules(this)"><summary>How To Play</summary><div class="rules-copy"><h3>Find the Hidden Answer</h3><p>Prince Fondant asks a question. Timber gives a truthful reply without answering directly.</p><p>Choose what Timber means: <strong>Yes</strong> or <strong>No</strong>.</p><ul><li>Each player chooses privately.</li><li>You have <strong>20 seconds</strong> and can change your answer until time runs out.</li><li>If you don’t choose, the game randomly picks an answer for you.</li></ul><h3>Build Together</h3><p>Your team shares one cottage, starting at <strong>50%</strong>. Every player’s answer counts toward the cottage’s progress.</p><p>More correct answers mean more building. For example:</p><ul><li>Everyone Correct: <strong>+20 Percentage Points</strong></li><li>Half Correct: <strong>+5 Percentage Points</strong></li><li>Everyone Wrong: <strong>−10 Percentage Points</strong></li></ul><h3>Save Their Cottage</h3><p>Reach <strong>100% within 10 rounds</strong> to win!</p><p>Your team has <strong>two gumdrop buttons</strong>. Each can be used once to add <strong>25 Percentage Points</strong>.</p><ul><li><strong>If the cottage reaches 0%:</strong> play pauses. Tap an available gumdrop to rebuild to <strong>25%</strong> and continue.</li><li><strong>After round 10:</strong> use any remaining gumdrops to help reach <strong>100%</strong>. Gumdrops do not add extra rounds.</li></ul><p>Prince Fondant wins if your team cannot save the cottage or chooses to continue without a rescue.</p></div></details>`}
function fitCottageIntro(){const e=document.querySelector('.cottage-intro');if(!e||!e.getBoundingClientRect)return;if(isMobileMode()){e.style.fontSize='15px';return}let low=5,high=28;for(let i=0;i<12;i++){const mid=(low+high)/2;e.style.fontSize=mid+'px';if(e.scrollWidth<=e.clientWidth)low=mid;else high=mid}e.style.fontSize=(Math.floor(low*10)/10)+'px'}
function sparkleSapphire(event){const svg=event.currentTarget.closest('svg');if(!svg)return;const ns='http://www.w3.org/2000/svg',layer=document.createElementNS(ns,'g');layer.setAttribute('aria-hidden','true');layer.setAttribute('pointer-events','none');svg.appendChild(layer);const still=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;const colors=['#ffffff','#d8c4ee','#b6d2d8','#eed395'];for(let i=0;i<30;i++){const angle=Math.random()*Math.PI*2,distance=22+Math.random()*85;const particle=document.createElementNS(ns,i%3===0?'path':'circle');if(i%3===0){particle.setAttribute('d','M0-4L1-1 4 0 1 1 0 4-1 1-4 0-1-1Z');particle.setAttribute('transform','translate(232 70)')}else{particle.setAttribute('cx','232');particle.setAttribute('cy','70');particle.setAttribute('r',String(1+Math.random()*1.8))}particle.setAttribute('fill',i%3===0?'#eed395':colors[i%colors.length]);if(i%3===0){particle.setAttribute('stroke','#426b78');particle.setAttribute('stroke-width','.8')}layer.appendChild(particle);const tx=still?0:Math.cos(angle)*distance,ty=still?0:Math.sin(angle)*distance-15;particle.animate([{opacity:0,translate:'0px 0px'},{opacity:1,offset:.12},{opacity:0,translate:tx+'px '+ty+'px'}],{duration:still?350:950+Math.random()*500,delay:Math.random()*100,fill:'forwards',easing:'ease-out'})}setTimeout(()=>layer.remove(),1700)}

function keepsakeStar(event){const star=event.currentTarget;const still=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;star.animate(still?[{opacity:.5},{opacity:1}]:[{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',filter:'brightness(1)'},{transform:'translate(-50%,-50%) scale(1.35) rotate(45deg)',filter:'brightness(1.25)'},{transform:'translate(-50%,-50%) scale(1) rotate(90deg)',filter:'brightness(1)'}],{duration:still?250:800,easing:'ease-out'})}

.8"/></g><g class="keepsake-lid"><path d="M80 108Q180 67 280 108L275 125Q180 151 85 125Z" fill="#b99abf"/><path d="M94 108Q180 80 266 108Q180 133 94 108Z" fill="#fff4df"/><path class="keepsake-heart" d="M180 114Q153 94 164 87Q175 82 180 94Q187 81 198 88Q208 99 180 114Z" fill="#e3abb4" stroke="#cf7185" stroke-width="2"/></g><rect x="173" y="144" width="14" height="17" rx="5" fill="#eed395"/><circle cx="180" cy="151" r="2" fill="#87654c" stroke="none"/></g></g></svg></summary></details><div class="keepsake-stars">${[[10,22],[25,10],[76,11],[90,30],[8,56],[91,62],[20,77],[79,79]].map(([x,y],i)=>`<button type="button" class="keepsake-star" data-sound="sapphire" aria-label="Sparkle keepsake star ${i+1}" style="left:${x}%;top:${y}%" onclick="keepsakeStar(event)"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="keepsakeStarStroke${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4b62e"/><stop offset="1" stop-color="#b7860b"/></linearGradient></defs><path d="M16 3L20 12 29 16 20 20 16 29 12 20 3 16 12 12Z" fill="#eed395" style="stroke:url(#keepsakeStarStroke${i})" stroke-width="2"/></svg></button>`).join('')}</div><p class="discover-hint keepsake-caption">Tap to open and close Ginger’s keepsake box.</p></div>`}
function scrapbookBuilders(s){const players=s.preview?(makerSavedState?.players||[]):s.players;if(!players.length)return '';return `<div class="scrapbook-builders"><h3>Builders Behind the Magic</h3><ul class="builder-names">${players.map(player=>`<li>${esc(player.name)}</li>`).join('')}</ul></div>`}
function teamScrapbook(s){const r=s.recap||{correct:s.result.count,guesses:s.players.length,perfect_rounds:s.result.count===s.players.length?1:0,rounds:s.round,rescues:2-s.buttons};const win=s.result.win,badge=win?(r.rescues?'Comeback Builders':r.perfect_rounds?'Clever Builders':'Sweet Success'):'Brave Builders';return `<section class="panel scrapbook"><div class="eyebrow">${s.preview?'Example Scrapbook':'Your Fairytale Scrapbook'}</div><h2>A chapter worth keeping.</h2>${scrapbookBook()}<p class="discover-hint">Tap to celebrate joy and love.</p><div class="team-badge"><strong>${badge}</strong></div><dl><div><dt>Correct Guesses</dt><dd>${r.correct} / ${r.guesses}</dd></div><div><dt>Perfect Team Rounds</dt><dd>${r.perfect_rounds}</dd></div><div><dt>Rounds Played</dt><dd>${r.rounds}</dd></div><div><dt>Gumdrop Rescues Used</dt><dd>${r.rescues} / 2</dd></div></dl>${sugarKeepsake()}${scrapbookBuilders(s)}</section>`}
function landing(){renderKey='';app.innerHTML=`<div class="grid">${scene()}<section class="panel play-panel"><div class="eyebrow">Truth or Crumbs?</div><h1 class="landing-title">Save their cottage.<br>Read between<br>the lines.</h1><p class="muted">Timber never lies. Can your team unravel his clever answers before Prince Fondant hammers the cottage down?</p><label class="field" for="name">Your Name</label><input id="name" maxlength="20" placeholder="Gingerbread" autocomplete="nickname"><label class="field" for="code">Room Code</label><input id="code" maxlength="5" placeholder="HOUSE" style="text-transform:uppercase" autocomplete="off"><div class="actions"><button onclick="enter('create')">Create Room</button><button class="secondary" onclick="enter('join')">Join Room</button></div>${rules()}</section></div>`;fitCottageIntro()}
async function enter(action){if(busy)return;busy=true;error('');try{session=await api(action,{name:document.querySelector('#name').value,code:document.querySelector('#code').value});sessionStorage.setItem('gingy-session',JSON.stringify(session));await poll()}catch(e){error(e.message)}finally{busy=false}}
async function act(action,data={}){if(state?.preview){openMakerResults();return}error('');try{state=await api(action,data);render()}catch(e){error(e.message)}}
function exit(){if(makerPreviewActive){leaveMakerPreview();return}session=null;state=null;sessionStorage.removeItem('gingy-session');error('');landing()}

async function copyRoomCode(button){if(!state?.code)return;return copyShareText(state.code,'Room code copied!','Copy this room code: ',button)}
async function copyWebsite(button){return copyShareText('https://nutmeg-ginger-cottage.airyant14.chatgpt.site/','Website link copied!','Copy this website link: ',button)}
async function copyShareText(code,success,fallback,button){let copied=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(code);copied=true}}catch(e){}if(!copied){const field=document.createElement('textarea');field.value=code;field.setAttribute('readonly','');field.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(field);field.select();try{copied=!!document.execCommand('copy')}catch(e){}field.remove();button?.focus()}const status=document.querySelector('#copy-status');if(status){status.textContent=copied?success:fallback+code;status.classList.toggle('copy-manual',!copied);clearTimeout(copyShareText.timer);if(copied){copyShareText.timer=setTimeout(()=>{status.textContent=''},1600)}}}
function packPicker(s,host){const packs=s.packs||[{id:'mixed',name:'All Fairytales',description:'A little of every kind of mischief.'}],selected=packs.find(p=>p.id===s.pack)||packs[0];return `<div class="pack-picker"><label class="field" for="question-pack">Question Pack</label>${host?`<select id="question-pack" onchange="act('set_pack',{pack:this.value})">${packs.map(p=>`<option value="${p.id}" ${p.id===selected.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:`<strong>${esc(selected.name)}</strong>`}<p class="muted">${esc(selected.description)} · 10 Rounds.</p></div>`}
function finalIntroActive(s){return s.phase==='question'&&s.round===10&&(s.intro_until||0)>Date.now()/1000+offset}
function charmingReveal(s){const perfect=s.result.count===s.players.length,positive=s.result.delta>0;const lines=perfect?['That was merely a practice trick.','My hair needs a moment to process this.','Clearly, the cottage has influential friends.']:positive?['A few biscuits? How terribly ambitious.','Enjoy your little head start, builders.','I shall be lodging a royal complaint.']:['A little more rubble for my royal collection.','Did someone order a dramatic demolition?','My plan is unfolding beautifully. Unlike that roof.'];return lines[(s.round-1)%lines.length]}
let celebratedRound='';
function celebratePerfect(s){const scene=document.querySelector('.scene-panel');if(!scene)return;if(!s.result||s.phase==='question'||s.phase==='lobby'||s.result.count!==s.players.length)return;const key=s.code+':'+s.round+':'+s.deadline;if(celebratedRound===key)return;celebratedRound=key;const layer=document.createElement('div');layer.className='icing-celebration';layer.setAttribute('aria-hidden','true');layer.innerHTML=Array.from({length:22},(_,i)=>`<span style="--x:${(i*47)%100}%;--delay:${i%5*.08}s;--turn:${i*31}deg">✦</span>`).join('');scene.appendChild(layer);setTimeout(()=>layer.remove(),2700)}

function render(){const s=state;if(!s)return;let key=JSON.stringify(s,(k,v)=>k==='server_time'?undefined:v);key+=String(finalIntroActive(s));if(key===renderKey){clock();return}renderKey=key;let content='';const host=s.me===s.host;
if(s.phase==='lobby')content=`<div class="eyebrow">Gather your fairytale builders</div><h1>Nutmeg<br>is counting on you.</h1><p class="muted">Share this website link and room code. Each player joins from their own device.</p><button type="button" class="bubble invite-website" onclick="copyWebsite(this)" aria-label="Copy website address" title="Tap to copy website address."><span class="speaker">WEBSITE</span><strong class="website-address">https://nutmeg-ginger-cottage.airyant14.chatgpt.site/</strong></button><div class="bubble"><span class="speaker">Room Code</span><button type="button" class="lobby-code-copy" onclick="copyRoomCode(this)" aria-label="Copy room code ${s.code}" title="Tap to copy room code.">${s.code}</button></div><ul class="results">${s.players.map(p=>`<li><span>${esc(p.name)} ${p.id===s.me?'(you)':''}</span><span class="muted">${p.id===s.host?'Host':'Ready'}</span></li>`).join('')}</ul>${packPicker(s,host)}${host?`<button style="width:100%" ${s.players.length<2?'disabled':''} onclick="act('start')">Start Game · ${s.players.length}/8 Players</button>`:'<p class="muted">Waiting for the host to start…</p>'}<p class="muted" style="margin-top:12px">${s.players.length<2?'At least two players are needed.':''}</p>${rules()}`;
else {const reveal=s.phase!=='question';content=`<div class="stat round-status"><span class="eyebrow">Round ${s.round} / 10 · ${reveal?'Truth comes out':'Make your own guess'}</span><strong class="timer" id="timer"></strong></div><div class="bubble puzzle-bubble"><span class="speaker">${face('prince','Prince Fondant')} Prince Fondant Asks</span><p>${esc(s.puzzle.question)}</p></div><div class="bubble puzzle-bubble"><span class="speaker">${face('pinocchio','Timber')} Timber Replies</span><p>${esc(s.puzzle.answer)}</p></div>`;
if(!reveal)content+=`<div class="bubble puzzle-bubble"><span class="speaker">${face('prince','Prince Fondant')} Prince Fondant Rebuts</span><p>${esc(s.taunt)}</p></div><div class="choices"><button class="${s.mine?.value===true?'selected':''}" aria-pressed="${s.mine?.value===true}" onclick="act('answer',{value:true,round:${s.round}})">Yes</button><button class="${s.mine?.value===false?'selected':''}" aria-pressed="${s.mine?.value===false}" onclick="act('answer',{value:false,round:${s.round}})">No</button></div><p class="muted" style="margin:16px 0 0">${s.mine?'Choice saved. You can change it until time runs out.':'What does Timber really mean?'} · ${s.answered}/${s.players.length} Answered.</p>`;
else {let r=s.result;content+=`<div class="bubble" role="status"><span class="speaker">${face('gingy','Nutmeg')} Nutmeg Answers ${r.correct?'Yes':'No'}</span><p>${esc(r.explanation)}</p></div><p class="${r.delta>=0?'correct':'wrong'}" style="margin:16px 0 4px">${r.count}/${s.players.length} Correct · ${r.delta>=0?'+':''}${Number(r.delta.toFixed(1))} Percentage Points</p>${r.rescued?characterQuote('gingy','Nutmeg','Not the gumdrop buttons!')+'<p class="muted">Nutmeg trades one button. The cottage gains 25 percentage points.</p>':''}<ul class="results">${s.players.map(p=>{let a=s.answers[p.id];return `<li><span>${esc(p.name)}${p.id===s.me?' (you)':''}</span><span class="${a.value===r.correct?'correct':'wrong'}">${a.value?'Yes':'No'} ${a.auto?'· Automatic':''} ${a.value===r.correct?'✓':'✕'}</span></li>`}).join('')}</ul>`;
content+=`${s.phase==='finished'?`<div class="perfect-round ending-quote">${s.result.win?face('prince','Prince Fondant'):face('gingy','Nutmeg')+face('pinocchio','Timber')}<div><strong>${s.result.win?'Prince Fondant':'Nutmeg & Timber'}</strong><small>“${s.result.win?esc(charmingReveal(s)):'A few crumbs won’t stop us. Pass the icing!'}”</small></div></div>`:characterQuote('prince','Prince Fondant',charmingReveal(s))}${s.phase==='finished'&&!s.result.win?`<div class="perfect-round ending-quote royal-round" role="status">${face('prince','Prince Fondant')}<div><strong>Prince Fondant</strong><small>“Royal round!”</small></div></div>`:s.result.count===s.players.length?`<div class="perfect-round ending-quote" role="status">${face('gingy','Nutmeg')}${face('wife','Ginger')}<div><strong>Nutmeg & Ginger</strong><small>“Gingerbread round!”</small></div></div>`:''}`;
if(['finished','rescue'].includes(s.phase))content=`<details class="round-review" open><summary>Round ${s.round} · Review Answers</summary>${content}</details>`;
if(s.phase==='finished')content+=`<div class="bubble"><span class="speaker">${r.win?face('wife',"Ginger")+' A sweet homecoming':face('prince','Prince Fondant')+' Prince Fondant wins this time'}</span><h2>${r.win?'You saved Nutmeg & Ginger’s home!':'Oh, crumbs.'}</h2><p>${r.win?'Ginger arrives to celebrate! Prince Fondant’s attack backfires: icing swirls his hair into a cupcake, topped with a cherry.':'Prince Fondant wins this round, but Nutmeg and Timber are gathering their tools. With your team beside them, their next cottage will be even sweeter.'}</p>${r.win?'<figure class="homecoming-art"><div class="art-window"><object type="image/svg+xml" data="/assets/happily-ever-after.svg?v=rose-outlines1" aria-label="Nutmeg and Ginger holding hands and smiling together, surrounded by hearts.">Nutmeg and Ginger holding hands and smiling together, surrounded by hearts.</object></div><button class="mobile-only secondary art-zoom" aria-expanded="false" onclick="toggleArtworkSize(this)">Enlarge Artwork</button><figcaption>Happily ever after.</figcaption><p class="discover-hint">Tap to discover little moments of magic.</p></figure>':''}${r.win?'<figure class="victory-art"><div class="art-window"><object type="image/svg+xml" data="/assets/prince-cupcake.svg?v=cherry-outline1" aria-label="Prince Fondant with his blonde hair covered in a swirl of cupcake icing topped with a cherry, his crown slipping sideways.">Prince Fondant with his blonde hair covered in a swirl of cupcake icing topped with a cherry, his crown slipping sideways.</object></div><button class="mobile-only secondary art-zoom" aria-expanded="false" onclick="toggleArtworkSize(this)">Enlarge Artwork</button><figcaption>A royally sweet makeover.</figcaption><p class="discover-hint">Tap to discover little moments of magic.</p></figure>':''}${!r.win?'<figure class="victory-art"><div class="art-window"><object type="image/svg+xml" data="/assets/prince-victory.svg?v=foley33" aria-label="Prince Fondant surrounded by magic wands, above shelves of trophies and medals.">Prince Fondant surrounded by magic wands, above shelves of trophies and medals.</object></div><button class="mobile-only secondary art-zoom" aria-expanded="false" onclick="toggleArtworkSize(this)">Enlarge Artwork</button><figcaption>A royal victory.</figcaption><p class="discover-hint">Tap to discover little moments of magic.</p></figure><figure class="homecoming-art"><div class="art-window"><object type="image/svg+xml" data="/assets/rebuild-team.svg?v=foley33" aria-label="Nutmeg and Timber surrounded by cupcakes, above shelves of icing, chocolate, candy and rebuilding supplies.">Nutmeg and Timber surrounded by cupcakes, above shelves of icing, chocolate, candy and rebuilding supplies.</object></div><button class="mobile-only secondary art-zoom" aria-expanded="false" onclick="toggleArtworkSize(this)">Enlarge Artwork</button><figcaption>Ready to rebuild together.</figcaption><p class="discover-hint">Tap to discover little moments of magic.</p></figure>':''}<div class="ending-dialogue"><div class="perfect-round ending-quote">${face('prince','Prince Fondant')}<div><strong>Prince Fondant</strong><small>“${r.win?'A daring new look.':'Another victory for my collection.'}”</small></div></div><div class="perfect-round ending-quote">${face('gingy','Nutmeg')}${!r.win?face('pinocchio','Timber'):''}<div><strong>${r.win?'Nutmeg':'Nutmeg & Timber'}</strong><small>“${r.win?'Looking sweet, Your Highness!':'Enjoy it while we preheat the oven!'}”</small></div></div></div></div>${host||r.win?'<button class="replay-team" style="width:100%;margin-top:24px" onclick="act(\'restart\')">Play Again With Your Team</button>':'<p class="muted waiting-replay">Waiting for the host to play again.</p>'}`;
else if(s.phase==='rescue')content+=`<div class="rescue-prompt" role="alert"><h2>One more chance?</h2><p>${s.round>=10?'The final round is over. Each gumdrop adds 25 percentage points. Reach 100% with your remaining gumdrops to win.':'The cottage has fallen to 0%. Use a gumdrop to rebuild to 25% and keep playing.'}</p><p>Choose an available gumdrop beside the cottage. Any player can rescue the team.</p>${host?'<button class="secondary" style="margin-top:12px" onclick="act(\'decline_rescue\')">Continue Without Rescue</button>':'<p class="muted">The host can choose to continue without a rescue.</p>'}</div>`;else content+='<p class="muted">Next question starts automatically in a moment…</p>';
}}
if(finalIntroActive(s))content=`<div class="final-round-intro" role="status"><div class="eyebrow">The Final Round</div><h1>One last chance, builders!</h1><div class="row">${face('gingy','Nutmeg')}${face('wife','Ginger')}</div><p>Read carefully. Trust your clever selves.</p><strong class="timer" id="timer"></strong></div>`;
app.innerHTML=`<div class="row room-header" style="margin-bottom:18px"><button type="button" class="chip room-code-copy" onclick="copyRoomCode(this)" aria-label="Copy room code ${s.code}" title="Tap to copy room code.">Room ${s.code}</button><span class="copy-status" id="copy-status" role="status" aria-live="polite"></span><span class="chip players-count" aria-label="${s.players.length} players in this room">${s.players.length} Players</span><span class="chip room-meta">Team Nutmeg & Ginger</span>${s.phase!=='lobby'&&s.packs?`<span class="chip room-meta">${esc(s.packs.find(p=>p.id===s.pack)?.name||'All Fairytales')}</span>`:''}<div class="room-actions"><button type="button" class="secondary copy-website" onclick="copyWebsite(this)">Copy Website Link</button><button type="button" class="secondary copy-code" onclick="copyRoomCode(this)">Copy Room Code</button><button class="secondary menu-return" onclick="exit()">Return to Main Menu</button></div></div><div class="grid game-grid" data-phase="${s.phase}"><div class="left-column scene-panel">${scene(s)}${s.phase==='finished'?teamScrapbook(s):''}</div><section class="panel play-panel">${content}</section></div>`;clock();applyDisplayMode();celebratePerfect(s)}
function askGumdrop(n){if(!state||state.phase!=='rescue'){error('You can use a gumdrop when the cottage reaches 0%, or after round 10 if it is still below 100%. The game pauses at those times so your team can choose whether to use a gumdrop.');return}if(state.used_gumdrops?.includes(n)){error('That gumdrop has already been used.');return}act('rescue',{gumdrop:n})}
function clock(){let t=document.querySelector('#timer');if(!t||!state)return;let end=finalIntroActive(state)?state.intro_until:state.phase==='question'?state.deadline:state.next_at;t.textContent=['finished','rescue'].includes(state.phase)?'':Math.max(0,Math.ceil(end-(Date.now()/1000+offset)))+'s'}
let polling=false;async function poll(){if(makerPreviewActive||!session||polling)return;polling=true;try{const res=await fetch('/api/state?'+new URLSearchParams(session),{cache:'no-store'});const d=await res.json();if(!res.ok){if(res.status===404){exit();error(d.error);return}throw Error(d.error)}state=d;offset=d.server_time-Date.now()/1000;error('');render()}catch(e){error('Connection interrupted. Reconnecting… '+e.message)}finally{polling=false}}
if(typeof ResizeObserver!=='undefined'){const introObserver=new ResizeObserver(fitCottageIntro);introObserver.observe(document.querySelector('main'))}
if(session)poll();else landing();setInterval(poll,700);setInterval(clock,150);

let clickSoundsEnabled=true;try{if(typeof localStorage!=='undefined')clickSoundsEnabled=localStorage.getItem('gingy-sound')!=='off'}catch(e){}
let clickSoundContext=null;
const effectKinds=["kitchen-floor", "kitchen-walls", "oven", "fridge", "macaron-table", "espresso", "living-floor", "living-walls", "sofa", "fireplace", "jawbreaker", "lamp", "office-floor", "office-walls", "desk", "bookshelf", "pretzel-chair", "rock-candy", "bedroom-floor", "bedroom-walls", "cotton-bed", "wardrobe", "candyfloss", "family-painting", "bathroom-floor", "bathroom-walls", "tea", "sink", "towel", "cabinet", "pantry-floor", "pantry-walls", "gummy-song", "fudge", "trolley", "pocky-board", "gumdrop", "sapphire", "heart", "chocolate-button", "icing", "cherry", "petal", "bow", "cake", "freezer", "magical-light", "ui", "wand", "crown", "trophy", "certificate", "medal", "jar", "toolbox", "chocolate", "candy", "feather", "icing-tube", "cupcake", "storybook-page", "storybook-rings", "storybook-heart", "outside", "inside", "enter-cottage", "first-floor", "second-floor", "enter-kitchen", "enter-living", "enter-office", "enter-bedroom", "enter-bathroom", "enter-pantry", "room-enlarge", "desk-books", "desk-lamp", "keepsake-box"];
const soundBuffers=new Map(),activeClickSounds=new Set();
let soundEpoch=0;
function soundLabel(){const button=document.querySelector('#sound-toggle');if(button){button.textContent=clickSoundsEnabled?'Sound: On':'Sound: Off';button.setAttribute('aria-pressed',String(clickSoundsEnabled))}}
function prepareClickSound(){if(!clickSoundsEnabled)return null;try{const Engine=typeof window!=='undefined'&&(window.AudioContext||window.webkitAudioContext);if(!Engine)return null;if(!clickSoundContext)clickSoundContext=new Engine();if(clickSoundContext.state==='suspended')clickSoundContext.resume().catch(()=>{});return clickSoundContext}catch(e){return null}}
function loadSoundEffect(kind,context){if(!soundBuffers.has(kind)){const request=fetch('/assets/sfx/'+kind+'.wav?v=gentle3').then(r=>{if(!r.ok)throw Error('Sound unavailable');return r.arrayBuffer()}).then(data=>context.decodeAudioData(data)).catch(error=>{soundBuffers.delete(kind);throw error});soundBuffers.set(kind,request)}return soundBuffers.get(kind)}
async function playClickSound(kind='ui'){if(!clickSoundsEnabled||kind===null)return;kind=effectKinds.includes(kind)?kind:'ui';const context=prepareClickSound(),epoch=soundEpoch;if(!context)return;try{const buffer=await loadSoundEffect(kind,context);if(!clickSoundsEnabled||epoch!==soundEpoch)return;while(activeClickSounds.size>=4){const oldest=activeClickSounds.values().next().value;try{oldest.stop()}catch(e){}activeClickSounds.delete(oldest)}const voice=context.createBufferSource(),gain=context.createGain();voice.buffer=buffer;gain.gain.value=.45;voice.connect(gain);gain.connect(context.destination);activeClickSounds.add(voice);voice.onended=()=>{activeClickSounds.delete(voice);voice.disconnect();gain.disconnect()};voice.start()}catch(e){}}
function preloadSoundEffects(){const context=prepareClickSound();if(context)for(const kind of effectKinds)loadSoundEffect(kind,context).catch(()=>{})}
function toggleSoundEffects(){clickSoundsEnabled=!clickSoundsEnabled;soundEpoch++;try{if(typeof localStorage!=='undefined')localStorage.setItem('gingy-sound',clickSoundsEnabled?'on':'off')}catch(e){}soundLabel();if(clickSoundsEnabled){playClickSound('ui');preloadSoundEffects()}else{for(const voice of activeClickSounds){try{voice.stop()}catch(e){}}activeClickSounds.clear()}}
function soundForTarget(target){if(target.closest?.('[data-sound="silent"]'))return null;const sound=target.closest?.('[data-sound]')?.getAttribute('data-sound')||target.querySelector?.('[data-sound]')?.getAttribute('data-sound');return effectKinds.includes(sound)?sound:'ui'}
const artworkSounds={heart:'heart',button:'chocolate-button',icing:'icing',bounce:'cherry',cherry:'cupcake',petal:'petal',bow:'bow',feather:'feather','icing-tube':'icing-tube',chocolate:'chocolate',candy:'candy',wand:'wand',crown:'crown',trophy:'trophy',certificate:'certificate',medal:'medal',jar:'jar',toolbox:'toolbox'};
soundLabel();
if(document.addEventListener){document.addEventListener('click',event=>{const target=event.target.closest('button,summary,select,[role="button"]');if(target&&!target.disabled&&target.id!=='sound-toggle')playClickSound(soundForTarget(event.target))},true);document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"]:not(button)'))playClickSound(soundForTarget(event.target))})}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='gingy-art-click')return;const fromArt=Array.from(document.querySelectorAll('object')).some(object=>{try{return object.contentDocument?.defaultView===event.source}catch(e){return false}});if(fromArt)playClickSound(artworkSounds[event.data.kind]||'ui')});
// Original, softly rendered chamber score; no live buzzy oscillator patches.
const fairytaleMusic={audio:null,enabled:sessionStorage.getItem('gingy-music')!=='off'};
function musicLabel(){const b=document.querySelector('#music-toggle');if(b){b.textContent=fairytaleMusic.enabled?'Music: On':'Music: Off';b.setAttribute('aria-pressed',String(fairytaleMusic.enabled))}}
async function startFairytaleMusic(){try{const m=fairytaleMusic;if(!m.audio){m.audio=new Audio('/assets/fairytale-orchestra.wav?v=heroic2');m.audio.loop=true;m.audio.volume=.35;m.audio.preload='none'}await m.audio.play();m.enabled=true;sessionStorage.setItem('gingy-music','on');musicLabel()}catch(e){fairytaleMusic.enabled=false;musicLabel()}}
async function toggleFairytaleMusic(){if(fairytaleMusic.enabled){if(fairytaleMusic.audio)fairytaleMusic.audio.pause();fairytaleMusic.enabled=false;sessionStorage.setItem('gingy-music','off');musicLabel()}else await startFairytaleMusic()}
musicLabel();
if(document.addEventListener)document.addEventListener('pointerdown',function beginFairytaleMusic(event){if(event.target.closest('#music-toggle'))return;if(sessionStorage.getItem('gingy-music')!=='off')startFairytaleMusic();document.removeEventListener('pointerdown',beginFairytaleMusic)});
</script></body></html>
